workflows:
  ios-unsigned:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "BleNoise.xcodeproj"
        XCODE_SCHEME: "BleNoise"
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build unsigned app
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          APP="build/Build/Products/Release-iphoneos/BleNoise.app"
          test -d "$APP"
          rm -rf Payload BleNoise-Unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r BleNoise-Unsigned.ipa Payload
          ls -lh BleNoise-Unsigned.ipa
    artifacts:
      - BleNoise-Unsigned.ipa
