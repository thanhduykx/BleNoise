name: BleNoise
options:
  bundleIdPrefix: com.duy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  BleNoise:
    type: application
    platform: iOS
    sources:
      - path: BleNoiseApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duy.blenoise
        PRODUCT_NAME: BleNoise
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BLE Noise
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Ung dung can Bluetooth de phat quang cao BLE."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
